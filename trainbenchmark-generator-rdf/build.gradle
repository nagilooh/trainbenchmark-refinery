apply plugin: 'com.github.johnrengelman.shadow'

shadowJar {
	archiveClassifier = 'fat'
	manifest { attributes 'Main-Class': 'hu.bme.mit.trainbenchmark.generator.rdf.RdfGeneratorMain' }
}

dependencies {
	implementation project(':trainbenchmark-config')
	implementation project(':trainbenchmark-generator')
	implementation project(':trainbenchmark-format-rdf')
	implementation group: 'org.slf4j', name: 'slf4j-nop', version: slf4jVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-model', version: sesameVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-repository-sail', version: sesameVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-sail-memory', version: sesameVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-repository-contextaware', version: sesameVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-rio-rdfxml', version: sesameVersion
	implementation group: 'org.openrdf.sesame', name: 'sesame-rio-turtle', version: sesameVersion
	implementation project(':refinery')
}
