buildscript {
  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    classpath "org.gretty:gretty:4.1.3"
  }
}

apply plugin: "org.gretty"

task page() {
  doLast {
    copy {
      from '../trainbenchmark-reporting'
      into 'src/main/webapp/diagrams'
      include '*.pdf'
    }

    copy {
      from '../diagrams'
      into 'src/main/webapp/diagrams'
      include '*.pdf'
    }

    appRun.contextPath = ''
		appRun.inplaceMode = 'hard'
    appRun.execute()
  }
}
